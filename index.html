<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VG FRAGRANCE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
}

header{
background:black;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid gold;
}

.logo{
font-size:28px;
font-weight:bold;
color:gold;
}

nav a{
color:white;
text-decoration:none;
margin-left:18px;
font-size:15px;
}

.hero{
text-align:center;
padding:70px 20px;
}

.hero img{
width:230px;
border-radius:20px;
box-shadow:0 0 25px gold;
}

.hero h1{
margin-top:25px;
font-size:42px;
color:gold;
}

.hero p{
margin-top:15px;
font-size:18px;
color:#ddd;
line-height:30px;
}

.btn{
display:inline-block;
margin-top:30px;
background:gold;
padding:16px 35px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
color:black;
font-size:18px;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<header>

<div class="logo">

VG FRAGRANCE

</div>

<nav>

<a href="#">Home</a>

<a href="#">Products</a>

<a href="#">Reviews</a>

<a href="#">Contact</a>

</nav>

<section class="hero">

<img src="hero.jpg">

<h1>Luxury Perfumes</h1>

<p>

Premium Fragrances That Make Every Moment Special

</p>

<a class="btn"

href="https://www.instagram.com/vg._fragrance_/"

target="_blank">

ORDER NOW

</a>

</section>

</html>
